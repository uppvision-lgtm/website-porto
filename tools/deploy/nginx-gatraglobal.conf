server {
    listen 80;
    listen [::]:80;
    server_name gatraglobal.id www.gatraglobal.id;

    root /var/www/gatraglobal.id;
    index index.html;

    # kompresi teks
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # cache aset jangka panjang
    location ~* \.(png|jpg|jpeg|gif|svg|mp4|webm|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
